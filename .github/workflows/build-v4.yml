name: Build APK v4
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          if [ -f settings.gradle ]; then
            DIR=.
          else
            ZIP=$(ls *live*.zip 2>/dev/null | head -1)
            [ -z "$ZIP" ] && ZIP=$(ls *.zip | head -1)
            echo "Using $ZIP"
            mkdir -p src
            unzip -q -o "$ZIP" -d src
            DIR=$(dirname "$(find src -name settings.gradle | head -1)")
          fi
          echo "Project dir: $DIR"
          echo "DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd "$DIR" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OrdinateurDeBord-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
